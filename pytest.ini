[pytest]
# Pytest configuration for Job Scraper project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# Markers for test categorization
markers =
    unit: Unit tests
    property: Property-based tests
    integration: Integration tests
    slow: Slow running tests
    requires_browser: Tests that require browser automation
    requires_api: Tests that require API keys

# Coverage options (optional)
# Uncomment to enable coverage reporting
# addopts = --cov=. --cov-report=html --cov-report=term

# Timeout for tests (in seconds)
timeout = 300

# Ignore paths
norecursedirs = 
    .git
    .hypothesis
    __pycache__
    data
    logs
    .kiro
